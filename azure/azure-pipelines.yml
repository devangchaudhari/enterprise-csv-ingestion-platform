trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '20.x'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/retail_dw'

stages:
  - stage: LintAndQuality
    displayName: '1. Quality, Linting & Type Checks'
    jobs:
      - job: CodeQuality
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
          - script: |
              python -m pip install --upgrade pip
              pip install flake8 mypy black
              black --check backend/
            displayName: 'Python Linting & Formatting Check'

  - stage: BackendTests
    displayName: '2. Backend Unit & Scenario Tests'
    jobs:
      - job: Pytest
        services:
          postgres: postgres
          redis: redis
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
          - script: |
              python -m pip install -r backend/requirements.txt
              pytest backend/tests/ -v --junitxml=junit-test-results.xml
            displayName: 'Run Pytest Suite'

  - stage: FrontendTests
    displayName: '3. Frontend Build & Vitest'
    jobs:
      - job: Vitest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - script: |
              cd frontend
              npm ci
              npm run test:run
              npm run build
            displayName: 'Run Frontend Tests & Production Build'

  - stage: dbtWarehouseTests
    displayName: '4. dbt Models & Integrity Tests'
    jobs:
      - job: DbtExecution
        steps:
          - script: |
              pip install dbt-core dbt-postgres
              cd dbt/retail_dbt
              dbt deps
              dbt compile
            displayName: 'Compile dbt Models & Verify Schema Tests'

  - stage: ContainerBuild
    displayName: '5. Docker Build & Container Image Push'
    jobs:
      - job: DockerBuild
        steps:
          - task: Docker@2
            inputs:
              command: 'build'
              dockerfile: 'backend/Dockerfile'
              tags: 'omniretail-backend:$(Build.BuildId)'
          - task: Docker@2
            inputs:
              command: 'build'
              dockerfile: 'frontend/Dockerfile'
              tags: 'omniretail-frontend:$(Build.BuildId)'

  - stage: DeployDev
    displayName: '6. Deployment to Development Environment'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployApp
        environment: 'retail-dev-cluster'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying OmniRetail Enterprise Data Platform to Azure Container Apps..."
