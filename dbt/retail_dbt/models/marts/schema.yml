version: 2

models:
  - name: mart_sales
    description: "Daily store level retail revenue and order counts"
    columns:
      - name: order_date
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: total_revenue_usd
        tests:
          - not_null

  - name: mart_inventory
    description: "Real-time stockout risk and reorder triggers"
    columns:
      - name: store_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: stock_level_status
        tests:
          - accepted_values:
              values: ['critical', 'low', 'optimal', 'surplus']

  - name: mart_supplier_performance
    description: "Vendor fulfillment SLA tracking and ratings"
    columns:
      - name: supplier_id
        tests:
          - unique
          - not_null
      - name: overall_health_score
        tests:
          - not_null
